<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NC Program Generator - Mitsubishi MCV</title>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f5f5f5;
      }

      .container {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #2c3e50;
        text-align: center;
        margin-bottom: 30px;
        border-bottom: 3px solid #3498db;
        padding-bottom: 10px;
      }

      .section {
        margin-bottom: 25px;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: #fafafa;
      }

      .section h3 {
        color: #34495e;
        margin-bottom: 15px;
        font-size: 16px;
        font-weight: bold;
      }

      .material-section {
        display: flex;
        gap: 20px;
        align-items: center;
      }

      .material-option {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
        margin-top: 10px;
      }

      .checkbox-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px;
      }

      input[type="checkbox"] {
        transform: scale(1.2);
      }

      input[type="radio"] {
        transform: scale(1.2);
      }

      .thickness-input {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
      }

      input[type="number"] {
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        width: 100px;
      }

      .part-info {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 15px;
        align-items: center;
      }

      input[type="text"] {
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        width: 200px;
      }

      .generate-btn {
        background-color: #27ae60;
        color: white;
        padding: 15px 30px;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        display: block;
        margin: 30px auto;
        transition: background-color 0.3s;
      }

      .generate-btn:hover {
        background-color: #219a52;
      }

      .output {
        margin-top: 30px;
        padding: 20px;
        background-color: #2c3e50;
        color: #ecf0f1;
        border-radius: 8px;
        font-family: "Courier New", monospace;
        white-space: pre-wrap;
        max-height: 500px;
        overflow-y: auto;
        display: none;
      }

      .copy-btn {
        background-color: #3498db;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-bottom: 10px;
      }

      .copy-btn:hover {
        background-color: #2980b9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>NC Program Generator - Mitsubishi MCV</h1>

      <!-- Material Selection -->
      <div class="section">
        <h3>材料選択 (Material Selection)</h3>
        <div class="material-section">
          <div class="material-option">
            <input type="radio" id="al" name="material" value="AL" checked />
            <label for="al">AL (Aluminum)</label>
          </div>
          <div class="material-option">
            <input type="radio" id="ss" name="material" value="SS" />
            <label for="ss">SS (Steel)</label>
          </div>
          <div class="material-option">
            <input type="radio" id="sus" name="material" value="SUS" />
            <label for="sus">SUS (Stainless Steel)</label>
          </div>
        </div>
      </div>

      <!-- Threaded Holes -->
      <div class="section">

          <div class="checkbox-item">
            <input type="checkbox" id="m2" value="M2" />

          <div class="checkbox-item">
            <input type="checkbox" id="m3" value="M3" />
            <label for="m3">M3 (φ2.6)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="m4" value="M4" />
            <label for="m4">M4 (φ3.4)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="m5" value="M5" />
            <label for="m5">M5 (φ4.3)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="m6" value="M6" />
            <label for="m6">M6 (φ5.0)</label>
          </div>
          <div class="checkbox-item">

            <input type="checkbox" id="h7_5" value="5H7" />

            <input type="checkbox" id="cb_3565" value="3.5/6.5E" />

          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="cb_458" value="4.5/8E" />

          <div class="checkbox-item">
            <input type="checkbox" id="th_1" value="1" />
            <label for="th_1">φ1</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="th_2" value="2" />
            <label for="th_2">φ2</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="th_3" value="3" />
            <label for="th_3">φ3</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="th_4" value="4" />
            <label for="th_4">φ4</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="th_5" value="5" />
            <label for="th_5">φ5</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="th_6" value="6" />
            <label for="th_6">φ6</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="th_7" value="7" />

          </div>
          <div class="checkbox-item">

          <div class="checkbox-item">
            <input type="checkbox" id="th_11" value="11" />

          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="th_12" value="12" />
            <label for="th_12">φ12</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="th_13" value="13" />

          </div>
          <div class="checkbox-item">

          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="th_15" value="15" />

          <div class="checkbox-item">

      <!-- Pocket Operations -->

            <option value="O2000">O2000</option>
            <option value="O3000">O3000</option>

            <option value="O5000">O5000</option>

    <script>
      // Add console logging for debugging
      document.addEventListener("DOMContentLoaded", function () {
        console.log("=== NC PROGRAM GENERATOR LOADED ===");

        // Track material selection changes
        document.querySelectorAll('input[name="material"]').forEach((radio) => {
          radio.addEventListener("change", function () {
            console.log(`📋 Material selected: ${this.value}`);
          });
        });

        // Track all checkbox changes
        document
          .querySelectorAll('input[type="checkbox"]')
          .forEach((checkbox) => {
            checkbox.addEventListener("change", function () {
              const label = this.nextElementSibling.textContent;
              console.log(
                `${this.checked ? "✅" : "❌"} ${this.value}: ${label}`
              );
            });
          });

        // Track thickness changes
        document
          .getElementById("thickness")
          .addEventListener("input", function () {
            console.log(`📏 Thickness changed: ${this.value}mm`);
          });

        // Track part info changes
        document
          .getElementById("program_number")
          .addEventListener("input", function () {
            console.log(`🔢 Program number: ${this.value}`);
          });

        document
          .getElementById("part_name")
          .addEventListener("input", function () {
            console.log(`📝 Part name: ${this.value}`);
          });
      });

      function createToolAssignment(processes) {
        console.log("🔧 Creating SEQUENTIAL tool assignment T1-T18...");

        /* ====================================================================
         * MITSUBISHI MCV TOOL ASSIGNMENT STRATEGY
         * ====================================================================
         *
         * PERMANENT TOOLS (Fixed Positions):
         * T1  H1  = Center Drill (always present)
         * T2  H2  = M3 Drill (φ2.6) - if M3 selected
         * T3  H3  = M4 Drill (φ3.4) - if M4 selected
         * T4  H4  = M5 Drill (φ4.3) - if M5 selected
         * T5  H5  = M6 Drill (φ5.0) - if M6 selected
         * T15 H15 = Prehole Drill (φ10.8) - if prehole selected
         * T16 H16 = 10mm Rough Endmill - if rough10 selected
         * T17 H17 = 10mm Finish Endmill - if finish10 selected
         * T18 H18 = Chamfer Tool - if chamfer selected
         *
         * SEQUENTIAL TOOLS (T6-T14):
         * Priority Order: M3-M6 Taps → M2/M2.5 → M8+ → Precision → Counterbore → Through
         *
         * CRITICAL: M2/M2.5 processed FIRST in sequential to prevent tool mismatch
         * when mixed with permanent M3-M6 tools
         * ====================================================================
         */
        const tools = [
          {
            tNumber: 1,
            hNumber: 1,
            type: "center_drill",
            description: "CENTER DRILL",
          },
        ];

        // Add permanent drills T2-T5 for M3-M6 AND nagaana (if selected)
        console.log(
          "\n🔧 NAGAANA TOOL ASSIGNMENT DEBUG: Analyzing fixed drill sharing..."
        );
        const fixedDrills = {
          M3: {
            tNumber: 2,
            hNumber: 2,
            diameter: 2.6,
            description: "φ2.6 DRILL",
          },
          M4: {
            tNumber: 3,
            hNumber: 3,
            diameter: 3.4,
            description: "φ3.4 DRILL",
          },
          M5: {
            tNumber: 4,
            hNumber: 4,
            diameter: 4.3,
            description: "φ4.3 DRILL",
          },
          M6: {
            tNumber: 5,
            hNumber: 5,
            diameter: 5.0,
            description: "φ5.0 DRILL",
          },
        };

        // Add fixed drills for selected M3-M6 OR compatible nagaana
        const threadedProcesses = processes.filter(
          (p) => p.type === "threaded"
        );
        const usedFixedTools = new Set();

        // Priority 1: Add threaded fixed drills
        threadedProcesses.forEach((process) => {
          if (fixedDrills[process.size]) {
            tools.push({
              ...fixedDrills[process.size],
              type: "drill",
              size: process.size,
              process: process,
              sharedWith: [], // Track what processes share this drill
            });
            usedFixedTools.add(fixedDrills[process.size].tNumber);
            console.log(
              `  ✅ FIXED DRILL: T${fixedDrills[process.size].tNumber} for ${
                process.size
              } (threaded)`
            );
          }
        });

        // Add permanent tools T15-T17 (if selected individually)
        const preholeProcess = processes.find((p) => p.type === "prehole");
        if (preholeProcess) {
          tools.push({
            tNumber: 15,
            hNumber: 15,
            type: "prehole",
            diameter: 10.8,
            description: "φ10.8 PREHOLE DRILL",
            process: preholeProcess,
          });
        }

        const rough10Process = processes.find((p) => p.type === "rough10");
        if (rough10Process) {
          tools.push({
            tNumber: 16,
            hNumber: 16,
            type: "rough10",
            diameter: 10,
            description: "φ10 ROUGH ENDMILL",
            process: rough10Process,
          });
        }

        const finish10Process = processes.find((p) => p.type === "finish10");
        if (finish10Process) {
          tools.push({
            tNumber: 17,
            hNumber: 17,
            type: "finish10",
            diameter: 10,
            description: "φ10 FINISH ENDMILL",
            process: finish10Process,
          });
        }

        // Add permanent chamfer tool T18 (if chamfer selected)
        const chamferProcess = processes.find((p) => p.type === "chamfer");
        if (chamferProcess) {
          tools.push({
            tNumber: 18,
            hNumber: 18,
            type: "chamfer",
            description: "CHAMFER TOOL",
            process: chamferProcess,
          });
        }

        // Sequential assignment starting from T6
        let currentTNumber = 6;

        // PRIORITY ORDER: Taps → Reamers → Endmills → Through drills

        // STEP 1: Assign M3-M6 taps first (T6, T7, T8, T9)
        const priorityTaps = ["M3", "M4", "M5", "M6"];
        priorityTaps.forEach((tapSize) => {
          const process = threadedProcesses.find((p) => p.size === tapSize);
          if (process) {
            tools.push({
              tNumber: currentTNumber,
              hNumber: currentTNumber,
              type: "tap",
              size: process.size,
              description: `${process.size} TAP`,
              process: process,
            });
            console.log(
              `  ✅ PRIORITY TAP: T${currentTNumber} = ${process.size} tap`
            );
            currentTNumber++;
          }
        });

        // STEP 2: Assign OTHER TAPS with their drills
        // CRITICAL: M2/M2.5 are processed FIRST to get sequential T6,T7,T8,T9
        // This prevents tool assignment mismatch when M2/M2.5 are mixed with M3-M6
        // Array order: ['M2', 'M2.5'] get T6-T9, then ['M8', 'M10', 'M12', 'M16', 'M20'] get T10+
        const otherThreadedData = {
          M2: 1.6,

              tNumber: currentTNumber,
              hNumber: currentTNumber,

        // 🎯 GROUP NAGAANA BY ENDMILL DIAMETER

        nagaanaProcesses.forEach((process) => {
          const spec = tempNagaanaManager.nagaanaSpecs[process.size];
          if (!spec) return;

          const endmillDia = spec.endmill;
          if (!nagaanaByEndmill.has(endmillDia)) {
            nagaanaByEndmill.set(endmillDia, []);
          }
          nagaanaByEndmill.get(endmillDia).push(process);
        });

        console.log(`\n🔧 NAGAANA ENDMILL GROUPING:`);
        nagaanaByEndmill.forEach((processes, endmillDia) => {
          console.log(
            `   φ${endmillDia}E → ${processes.map((p) => p.size).join(", ")}`

        // STEP 2.5A: Add individual nagaana drills (if not shared)
        nagaanaProcesses.forEach((process) => {

        // STEP 2.5B: Add MERGED nagaana endmills (one tool per unique diameter)
        nagaanaByEndmill.forEach((groupedProcesses, endmillDia) => {

      function calculateDrillSpeedFeed(drillDia, material, speeds) {
        const T = speeds.T;
        const rawS = T / drillDia / 3.14;
        const rawF = rawS * 0.07;

        // Round both S and F to nearest tens
        const roundedS = Math.round(rawS / 10) * 10;
        const roundedF = Math.round(rawF / 10) * 10;

        console.log(
          `📊 Drill Speed Calc: φ${drillDia} ${material} → S=${roundedS} (${Math.round(
            rawS
          )}→${roundedS}), F=${roundedF} (${Math.round(rawF)}→${roundedF})`
        );

        return { S: roundedS, F: roundedF };
      }

      // ============================================================================
      // NAGAANA OPERATION MANAGER - Comprehensive solution for nagaana handling
      // ============================================================================
      class NagaanaOperationManager {
        constructor(processes, toolAssignment) {
          this.processes = processes;
          this.toolAssignment = toolAssignment;
          this.nagaanaProcesses = processes.filter((p) => p.type === "nagaana");
          this.precisionProcesses = processes.filter(
            (p) => p.type === "precision"
          );

          // Define nagaana specifications
          this.nagaanaSpecs = {
            "2H7N": { drill: 1.8, endmill: 1, sharesWith: "2H7" },
            "3H7N": { drill: 2.8, endmill: 2, sharesWith: "3H7" },
            "4H7N": { drill: 3.8, endmill: 3, sharesWith: "4H7" },
            "5H7N": { drill: 4.8, endmill: 3, sharesWith: "5H7" },
            "6H7N": { drill: 5.8, endmill: 4, sharesWith: "6H7" },
            "8H7N": { drill: 7.8, endmill: 6, sharesWith: "8H7" },
            "10H7N": { drill: 9.8, endmill: 6, sharesWith: "10H7" },
          };
          // Get material for roughing/finishing decision
          this.material = document.querySelector(
            'input[name="material"]:checked'
          ).value;

          console.log("🔧 NAGAANA MANAGER INITIALIZED");
          console.log(`   Nagaana processes: ${this.nagaanaProcesses.length}`);
          console.log(
            `   Precision processes: ${this.precisionProcesses.length}`
          );
        }

        // Check if specific nagaana shares drill with precision
        sharesDrillWithPrecision(nagaanaSize) {
          const spec = this.nagaanaSpecs[nagaanaSize];
          if (!spec) return false;
          return this.precisionProcesses.some(
            (p) => p.size === spec.sharesWith
          );
        }

        // Get drill operation info for nagaana
        getNagaanaDrillInfo(nagaanaProcess) {
          const spec = this.nagaanaSpecs[nagaanaProcess.size];
          if (!spec) return null;

          const sharesPrecision = this.sharesDrillWithPrecision(
            nagaanaProcess.size
          );

          if (sharesPrecision) {
            // Find the precision drill tool
            const precisionDrillTool = this.toolAssignment.find(
              (t) =>
                t.type === "precision_drill" &&
                t.process &&
                t.process.size === spec.sharesWith
            );

            return {
              shared: true,
              tool: precisionDrillTool,
              diameter: spec.drill,
              precisionSize: spec.sharesWith,
            };
          } else {
            // Find dedicated nagaana drill tool
            const nagaanaDrillTool = this.toolAssignment.find(
              (t) =>
                t.type === "nagaana_drill" &&
                t.process &&
                t.process.size === nagaanaProcess.size
            );

            return {
              shared: false,
              tool: nagaanaDrillTool,
              diameter: spec.drill,
            };
          }
        }

        // Build nagaana operations for main program
        buildNagaanaOperations(allOperations, opNum) {
          const nagaanaOps = [];

          // 🎯 GROUP NAGAANA BY ENDMILL TOOL
          const endmillTools = this.toolAssignment.filter(
            (t) => t.type === "nagaana_endmill"
          );
          const processedNagaana = new Set(); // Track which nagaana we've already processed

          this.nagaanaProcesses.forEach((process) => {
            if (processedNagaana.has(process.size)) {
              console.log(
                `\n⏭️ Skipping nagaana: ${process.size} (already merged with endmill operation)`
              );
              return; // Skip if already processed as part of merged endmill
            }

            console.log(`\n📋 Processing nagaana: ${process.size}`);

            const drillInfo = this.getNagaanaDrillInfo(process);

            // Find which endmill tool handles this nagaana (may be merged with others)
            const spec = this.nagaanaSpecs[process.size];
            const endmillTool = endmillTools.find(
              (t) => t.diameter === spec.endmill
            );

            if (drillInfo && drillInfo.tool) {
              if (drillInfo.shared) {
                const precisionDrillExists = allOperations.some(
                  (op) =>
                    op.type === "precision_drill" &&
                    op.size === drillInfo.precisionSize
                );

                if (precisionDrillExists) {
                  console.log(
                    `   🔄 SHARING DRILL: Using ${drillInfo.precisionSize} precision drill`
                  );
                } else {

                }
              } else {

                );
                nagaanaOps.push({
                  tool: drillInfo.tool,

                });

              }
            }

            // Add merged endmill operation (ONLY ONCE per unique endmill diameter)
            if (endmillTool) {

              );

                  `   🔍 Adding NAGAANA ENDMILL (MERGED): T${

                    .map((p) => p.size)

                );

                // Add roughing endmill operation
                nagaanaOps.push({
                  tool: endmillTool,
                  operationNumber: opNum,

                  size: endmillTool.size,
                  processType: "nagaana",
                  processes: endmillTool.processes,

                });
                opNum += 10;

                // For SS/SUS materials, add finishing endmill operation
                if (this.material === "SS" || this.material === "SUS") {
                  console.log(
                    `   🔍 Adding NAGAANA ENDMILL FINISH: T${
                      endmillTool.tNumber
                    } (${endmillTool.diameter}E) for ${endmillTool.processes
                      .map((p) => p.size)
                      .join(", ")}`
                  );

                  nagaanaOps.push({
                    tool: endmillTool,
                    operationNumber: opNum,
                    type: "nagaana_endmill_finish",
                    size: endmillTool.size,
                    processType: "nagaana",
                    processes: endmillTool.processes,
                    isFinishing: true,
                  });
                  opNum += 10;
                }

                // Mark all processes in this group as processed
                endmillTool.processes.forEach((p) =>
                  processedNagaana.add(p.size)
                );
              }
            }
          });

          return { operations: nagaanaOps, nextOpNum: opNum };
        }

        // Handle nagaana preload logic
        shouldPreloadNagaanaEndmill(currentOp, allOperations, currentIndex) {
          // Check if current op is precision drill and nagaana exists
          if (currentOp.type === "precision_drill") {
            // Find if there's a nagaana that shares this precision's drill
            const precisionSize = currentOp.size;
            const matchingNagaana = this.nagaanaProcesses.find((p) => {
              const spec = this.nagaanaSpecs[p.size];
              return spec && spec.sharesWith === precisionSize;
            });

            if (matchingNagaana) {
              // Find the nagaana endmill operation
              for (let i = currentIndex + 2; i < allOperations.length; i++) {
                if (
                  allOperations[i].type === "nagaana_endmill" &&
                  allOperations[i].size === matchingNagaana.size
                ) {
                  return allOperations[i];
                }
              }
            }
          }
          return null;
        }
      }

      function generateNCProgram(
        programNumber,
        partName,
        processes,
        thickness,
        speeds
      ) {
        console.log("🔧 Starting NC program generation...");
        console.log(`📝 Program: ${programNumber}(${partName})`);

        let program = `${programNumber}(${partName})\n`;

        // Extract base number from program number (O1000 → 1000, O2000 → 2000)
        const baseNumber = parseInt(programNumber.replace('O', '')) || 1000;
        let operationNumber = baseNumber + 10;
        console.log(`📊 Base number: ${baseNumber}, Starting operation: O${operationNumber}`);

        // Create tool assignment
        const toolAssignment = createToolAssignment(processes);

        let lineNumber = 1;
        let allOperations = [];

        // Build ALL operations in sequence
        console.log("\n🔧 BUILDING OPERATIONS SEQUENCE:");
        // Dynamic operation numbering: 1010 for milling-only, 1020 for mixed programs
        const hasAnyHoles = processes.some(
          (p) =>
            p.type === "threaded" ||
            p.type === "precision" ||
            p.type === "counterbore" ||
            p.type === "through" ||
            p.type === "prehole" || // PREHOLE IS A HOLE OPERATION!
            p.type === "nagaana" // NAGAANA IS A HOLE OPERATION!
        );

        // Enhanced program type detection for mixed scenarios
        const hasDrillingHoles = processes.some(
          (p) =>
            p.type === "threaded" ||
            p.type === "precision" ||
            p.type === "counterbore" ||
            p.type === "through"
        );
        const hasMillingOps = processes.some(
          (p) =>
            p.type === "prehole" ||
            p.type === "rough10" ||
            p.type === "finish10"
        );
        const hasChamferOp = processes.some((p) => p.type === "chamfer");

        // Program type classification
        const hasMultipleProcessTypes =
          [
            processes.some((p) => p.type === "threaded"),
            processes.some((p) => p.type === "precision"),
            processes.some((p) => p.type === "counterbore"),
            processes.some((p) => p.type === "through"),
            hasMillingOps,
          ].filter(Boolean).length > 1;

        const programType = {
          pureHoles:
            hasDrillingHoles && !hasMillingOps && !hasMultipleProcessTypes,
          pureMilling: !hasDrillingHoles && hasMillingOps,
          mixed: hasMultipleProcessTypes,
          chamferOnly: !hasDrillingHoles && !hasMillingOps && hasChamferOp,
        };

        console.log(`🎯 PROGRAM TYPE DETECTED:`, programType);
        console.log(`   - Pure Holes: ${programType.pureHoles}`);
        console.log(`   - Pure Milling: ${programType.pureMilling}`);
        console.log(`   - Mixed: ${programType.mixed}`);
        console.log(`   - Chamfer Only: ${programType.chamferOnly}`);

        let opNum = hasAnyHoles ? baseNumber + 20 : baseNumber + 10; // Start main operations (dynamic based on program number)
        console.log(
          `📊 Operation numbering: Starting at O${opNum} (${
            hasAnyHoles ? "mixed" : "milling-only"
          } program, base: ${baseNumber})`
        );

        // ===== MIXED PROGRAM OPERATION SEQUENCING =====
        if (programType.mixed) {
          console.log("\n🔄 MIXED PROGRAM: Applying operation sequencing...");
          console.log(
            "📋 Original operation order:",
            allOperations
              .map((op) => `T${op.tool.tNumber}(${op.type})`)
              .join(" → ")
          );

          // Sort allOperations by process type priority for mixed programs
          // Order: Threads → Precision → Counterbore → Through → Milling → Chamfer
          const processTypePriority = {
            threaded: 100, // Threads first
            precision: 200, // Precision second
            counterbore: 300, // Counterbore third
            through: 400, // Through fourth
            prehole: 500, // Prehole fifth
            rough10: 510, // Rough sixth
            finish10: 520, // Finish seventh
            chamfer: 600, // Chamfer last
          };

          // Within each process type, maintain tool number order
          allOperations.sort((a, b) => {
            const priorityA = processTypePriority[a.processType] || 999;
            const priorityB = processTypePriority[b.processType] || 999;

            if (priorityA !== priorityB) {
              return priorityA - priorityB; // Sort by process type priority
            } else {
              return a.tool.tNumber - b.tool.tNumber; // Within same type, sort by tool number
            }
          });

          console.log(
            "📋 Sequenced operation order:",
            allOperations
              .map((op) => `T${op.tool.tNumber}(${op.type})`)
              .join(" → ")
          );
          console.log("✅ Mixed program sequencing complete!\n");
        } else {
          console.log(
            `🔧 ${
              programType.pureHoles ? "PURE HOLES" : "PURE MILLING"
            } program - using existing operation order\n`
          );
        }

        // Process threaded holes (drill → tap pairs) - EACH THREAD SIZE COMPLETE BEFORE NEXT
        const threadedProcesses = processes.filter(
          (p) => p.type === "threaded"
        );

        /* ====================================================================
         * CRITICAL FIX FOR M2/M2.5 TOOL ASSIGNMENT MISMATCH
         * ====================================================================
         *
         * PROBLEM SOLVED: Mixed M2/M2.5 with M3-M6 caused tool/operation mismatch
         *
         * ROOT CAUSE:
         * - Tool Assignment: M2=T6, M2.5=T7, M3=T2, M4=T3 (by assignment logic)
         * - Operation Sequence: M2→M2.5→M3→M4 (by size sorting)
         * - Preload Logic: Expected tools in sequence T6→T7→T2→T3
         * - MISMATCH: Operation M3 expected after M2.5, but used different tool numbers!
         *
         * SOLUTION:
         * Sort operations by TOOL NUMBER instead of thread SIZE
         * - Tool Assignment: M3=T2, M4=T3, M2=T6, M2.5=T7 (unchanged)
         * - Operation Sequence: M3→M4→M2→M2.5 (by tool number T2→T3→T6→T7)
         * - Preload Logic: Tools now in correct sequence T2→T3→T6→T7
         *
         * RESULT: Perfect tool preload for any M2/M2.5 + M3-M6 combination
         * ====================================================================
         */
        // Sort threaded operations by TOOL NUMBER, not thread size
        // This ensures operation sequence matches tool assignment sequence
        threadedProcesses.sort((a, b) => {
          const toolA = toolAssignment.find(
            (t) => t.type === "drill" && t.process && t.process.size === a.size
          );
          const toolB = toolAssignment.find(
            (t) => t.type === "drill" && t.process && t.process.size === b.size
          );
          return (toolA?.tNumber || 999) - (toolB?.tNumber || 999);
        });
        threadedProcesses.forEach((process) => {
          const drillTool = toolAssignment.find(
            (t) =>
              t.type === "drill" && t.process && t.process.size === process.size
          );
          const tapTool = toolAssignment.find(
            (t) =>
              t.type === "tap" && t.process && t.process.size === process.size
          );

          // Add drill operation
          if (drillTool) {
            console.log(
              `  📍 Adding DRILL: T${drillTool.tNumber} H${drillTool.hNumber} (${process.size} - φ${drillTool.diameter})`
            );
            allOperations.push({
              tool: drillTool,
              operationNumber: opNum,
              type: "drill",
              size: process.size,
              processType: "threaded",
            });
            opNum += 10;
          }

          // Add tap operation immediately after drill
          if (tapTool) {
            console.log(
              `  📍 Adding TAP: T${tapTool.tNumber} H${tapTool.hNumber} (${process.size})`
            );
            allOperations.push({
              tool: tapTool,
              operationNumber: opNum,
              type: "tap",
              size: process.size,
              processType: "threaded",
            });
            opNum += 10;
          }
        });

        // Process precision holes (drill → ream pairs) + nagaana children
        const precisionProcesses = processes.filter(
          (p) => p.type === "precision"
        );
        precisionProcesses.forEach((process) => {
          const drillTool = toolAssignment.find(
            (t) =>
              t.type === "precision_drill" &&
              t.process &&
              t.process.size === process.size
          );
          const reamTool = toolAssignment.find(
            (t) =>
              t.type === "reamer" &&
              t.process &&
              t.process.size === process.size
          );

          if (drillTool) {
            console.log(
              `  📍 Adding PRECISION DRILL: T${drillTool.tNumber} H${drillTool.hNumber} (${process.size})`
            );
            allOperations.push({
              tool: drillTool,
              operationNumber: opNum,
              type: "precision_drill",
              size: process.size,
              processType: "precision",
            });
            opNum += 10;
          }

          if (reamTool) {
            console.log(
              `  📍 Adding REAMER: T${reamTool.tNumber} H${reamTool.hNumber} (${process.size})`
            );
            allOperations.push({
              tool: reamTool,
              operationNumber: opNum,
              type: "reamer",
              size: process.size,
              processType: "precision",
            });
            opNum += 10;
          }

          // 🎯 CHECK FOR MATCHING NAGAANA AND INSERT IMMEDIATELY
          const nagaanaSize = process.size + "N"; // e.g., "4H7" → "4H7N"
          const matchingNagaana = processes.find(
            (p) => p.type === "nagaana" && p.size === nagaanaSize
          );

          if (matchingNagaana) {
            console.log(
              `  🔗 Found matching nagaana: ${nagaanaSize} → inserting after ${process.size} reamer`
            );

            // Find the merged nagaana endmill tool
            const nagaanaSpec = {
              "2H7N": { endmill: 1 },
              "3H7N": { endmill: 2 },
              "4H7N": { endmill: 3 },
              "5H7N": { endmill: 4 },
              "6H7N": { endmill: 4 },
              "8H7N": { endmill: 6 },
              "10H7N": { endmill: 6 },

            const endmillDia = nagaanaSpec[nagaanaSize]?.endmill;

            const nagaanaEndmillTool = toolAssignment.find(
              (t) => t.type === "nagaana_endmill" && t.diameter === endmillDia
            );

            if (nagaanaEndmillTool) {
              // Check if we already added this endmill operation
              const alreadyAdded = allOperations.some(
                (op) =>
                  op.type === "nagaana_endmill" &&
                  op.tool.tNumber === nagaanaEndmillTool.tNumber
              );

              if (!alreadyAdded) {
                console.log(
                  `  📍 Adding NAGAANA ENDMILL: T${nagaanaEndmillTool.tNumber} H${nagaanaEndmillTool.hNumber} (${nagaanaEndmillTool.diameter}E) for ${nagaanaSize}`
                );
                allOperations.push({
                  tool: nagaanaEndmillTool,
                  operationNumber: opNum,
                  type: "nagaana_endmill",
                  size: nagaanaEndmillTool.size,
                  processType: "nagaana",
                  processes: nagaanaEndmillTool.processes,
                });
                opNum += 10;

                console.log(
                  `  ⏭️ Nagaana endmill T${nagaanaEndmillTool.tNumber} already added (merged with other nagaana)`
                );

            }
          }
        });

        // Process counterbore holes (drill → mill sequence)
        const counterboreProcesses = processes.filter(
          (p) => p.type === "counterbore"
        );
        counterboreProcesses.forEach((process) => {
          const drillTool = toolAssignment.find(
            (t) =>

          const millTool = toolAssignment.find(
            (t) =>

          );

          if (drillTool) {
            console.log(
              `  📍 Adding CB DRILL: T${drillTool.tNumber} H${drillTool.hNumber} (${process.size})`
            );
            allOperations.push({
              tool: drillTool,
              operationNumber: opNum,
              type: "counterbore_drill",
              size: process.size,

            });

          }

          if (millTool) {
            console.log(
              `  📍 Adding CB MILL: T${millTool.tNumber} H${millTool.hNumber} (${process.size})`
            );
            allOperations.push({
              tool: millTool,
              operationNumber: opNum,
              type: "counterbore_mill",

        // Process through holes (single drill operations)
        const throughProcesses = processes.filter((p) => p.type === "through");
        throughProcesses.forEach((process) => {
          const drillTool = toolAssignment.find(
            (t) =>
              t.type === "through_drill" &&

          );

          if (drillTool) {
            console.log(
              `  📍 Adding THROUGH DRILL: T${drillTool.tNumber} H${drillTool.hNumber} (φ${process.size})`
            );
            allOperations.push({
              tool: drillTool,
              operationNumber: opNum,

        console.log(
          "\n🔧 NAGAANA OPERATIONS DEBUG: Checking for remaining nagaana..."
        );

        // 🎯 Only add nagaana that weren't inserted after precision holes
        const alreadyAddedNagaana = new Set(
          allOperations
            .filter((op) => op.type === "nagaana_endmill")

          `  🔍 Already added nagaana: ${

        let nagaanaResult = null; // ✅ Initialize variable

          );

          );
          nagaanaResult = tempNagaanaManager.buildNagaanaOperations(

          );
          allOperations.push(...nagaanaResult.operations);
          opNum = nagaanaResult.nextOpNum;

          if (nagaanaResult.operations.length > 0) {
            console.log(`\n📊 STANDALONE NAGAANA OPERATIONS SUMMARY:`);
            console.log(
              `   Total standalone nagaana operations: ${nagaanaResult.operations.length}`
            );
            nagaanaResult.operations.forEach((op, index) => {

        } else {

            `  ✅ All nagaana already inserted after precision holes`
          );
          // ✅ Create empty result object for consistency
          nagaanaResult = { operations: [], nextOpNum: opNum };
        }

        // Now this line is safe - nagaanaResult always exists
        // (though opNum is already set correctly above)

        // Debug summary
        if (nagaanaResult.operations.length > 0) {

          console.log(
            `   Total nagaana operations: ${nagaanaResult.operations.length}`
          );
          nagaanaResult.operations.forEach((op, index) => {
            console.log(
              `   ${index + 1}. T${op.tool.tNumber} (${op.type}) - ${op.size}`
            );
          });
        }

        console.log("\n🏭 BUILDING MILLING OPERATIONS SEQUENCE:");
        const millingTypes = ["prehole", "rough10", "finish10", "chamfer"];
        const millingProcesses = processes.filter((p) =>
          millingTypes.includes(p.type)
        );
        console.log(
          `📊 Total milling processes to build: ${millingProcesses.length}`
        );
        millingProcesses.forEach((proc, index) => {
          console.log(`  ${index + 1}. ${proc.type} (${proc.size})`);

        console.log("==========================================");
        // Process individual milling operations
        const preholeProcesses = processes.filter((p) => p.type === "prehole");
        preholeProcesses.forEach((process) => {
          const preholeTool = toolAssignment.find(
            (t) =>
              t.type === "prehole" &&

          );

          if (preholeTool) {
            console.log(
              `  📍 Adding PREHOLE: T${preholeTool.tNumber} H${preholeTool.hNumber} (φ${preholeTool.diameter})`
            );
            allOperations.push({
              tool: preholeTool,
              operationNumber: opNum,
              type: "prehole",
              size: process.size,
              processType: "prehole",
            });
            opNum += 10;
          }
        });

        const rough10Processes = processes.filter((p) => p.type === "rough10");
        rough10Processes.forEach((process) => {
          const roughTool = toolAssignment.find(
            (t) =>
              t.type === "rough10" &&
              t.process &&
              t.process.size === process.size
          );

          if (roughTool) {
            console.log(
              `  📍 Adding 10MM ROUGH: T${roughTool.tNumber} H${roughTool.hNumber} (φ${roughTool.diameter})`
            );
            allOperations.push({
              tool: roughTool,
              operationNumber: opNum,
              type: "rough10",
              size: process.size,
              processType: "rough10",
            });
            opNum += 10;
          }
        });

        const finish10Processes = processes.filter(
          (p) => p.type === "finish10"
        );
        finish10Processes.forEach((process) => {
          const finishTool = toolAssignment.find(
            (t) =>
              t.type === "finish10" &&
              t.process &&
              t.process.size === process.size
          );

          if (finishTool) {
            console.log(
              `  📍 Adding 10MM FINISH: T${finishTool.tNumber} H${finishTool.hNumber} (φ${finishTool.diameter})`
            );
            allOperations.push({
              tool: finishTool,
              operationNumber: opNum,
              type: "finish10",
              size: process.size,
              processType: "finish10",
            });
            opNum += 10;
          }
        });

        // Process chamfer operations (single chamfer operation)
        const chamferProcesses = processes.filter((p) => p.type === "chamfer");
        chamferProcesses.forEach((process) => {
          const chamferTool = toolAssignment.find(
            (t) =>
              t.type === "chamfer" &&
              t.process &&
              t.process.size === process.size
          );

          if (chamferTool) {
            console.log(
              `  📍 Adding CHAMFER: T${chamferTool.tNumber} H${chamferTool.hNumber}`
            );
            allOperations.push({
              tool: chamferTool,
              operationNumber: opNum,
              type: "chamfer",
              size: process.size,
              processType: "chamfer",
            });
            opNum += 10;
          }
        });

        // Center drilling first - ONLY if holes are present
        const hasHoleOperations = processes.some(
          (p) =>
            p.type === "threaded" ||
            p.type === "precision" ||
            p.type === "counterbore" ||
            p.type === "through" ||
            p.type === "prehole" // PREHOLE IS A HOLE OPERATION!
        );

        if (
          programType.pureHoles ||
          programType.mixed ||
          (programType.pureMilling &&
            processes.some((p) => p.type === "prehole")) ||
          processes.some((p) => p.type === "nagaana")
        ) {
          // NAGAANA ALWAYS NEEDS CENTER DRILL
          // CENTER DRILL: For pure holes, mixed programs, or milling with prehole
          console.log(
            `🎯 Adding center drill operation: O${operationNumber} (${
              programType.pureHoles ? "PURE HOLES" : "MIXED"
            })`
          );
          program += `M98P${operationNumber}\n`;
          program += `M98P9999\n`;

          // Special preload logic for different program types
          if (programType.mixed) {

            const hasHoleOps = allOperations.some(
              (op) =>
                op.type === "drill" ||
                op.type === "tap" ||
                op.type === "precision_drill" ||
                op.type === "reamer" ||
                op.type === "counterbore_drill" ||

            );
            const hasMillingOps = allOperations.some(
              (op) =>
                op.type === "prehole" ||
                op.type === "rough10" ||
                op.type === "finish10"
            );

            if (hasHoleOps && hasMillingOps) {

              console.log(
                `🔧 CENTER DRILL PRELOAD (MIXED HOLES+MILLING): T${secondOperation.tool.tNumber} (${secondOperation.tool.description})`
              );
              program += `M6T${secondOperation.tool.tNumber}\n`;
            } else if (hasMillingOps && !hasHoleOps) {
              // MILLING ONLY: Preload first milling tool

                (op) =>

              );

            subroutines += `M8\n`;
            subroutines += `G00G17G90S${drillSF.S}M3\n`;
            subroutines += `G83Z-${zDepth}.R1.Q1.5F${drillSF.F}L0\n`;
            subroutines += `M98P${getPositionSubNumber(
              operation,
              processes
            )}\n`;
            subroutines += `G00G80\n`;
            subroutines += `M99\n\n`;
          } else if (operation.type === "nagaana_drill") {
            console.log(
              `  🔧 Nagaana drill subroutine: ${operation.size} (${operation.operationNumber})`
            );
            // Nagaana drill subroutine with dynamic Z-depth and calculated S/F
            const drillDia = tool.diameter;
            let zDepth;
            if (drillDia < 10) {
              zDepth = thickness + 3;
            } else if (drillDia >= 10 && drillDia < 18) {
              zDepth = thickness + 5;
            } else if (drillDia >= 15 && drillDia < 25) {
              zDepth = thickness + 7;
            } else {
              zDepth = thickness + 2;
            }

            // Calculate dynamic S and F based on material and drill diameter
            const material = document.querySelector(
              'input[name="material"]:checked'
            ).value;
            const drillSF = calculateDrillSpeedFeed(drillDia, material, speeds);

            subroutines += `O${operation.operationNumber}(${tool.diameter}-DL)\n`;
            subroutines += `M8\n`;
            subroutines += `G00G17G90S${drillSF.S}M3\n`;
            subroutines += `G83Z-${zDepth}.R1.Q1.5F${drillSF.F}L0\n`;
            subroutines += `M98P${getPositionSubNumber(
              operation,
              processes
            )}\n`;
            subroutines += `G00G80\n`;
            subroutines += `M99\n\n`;
          } else if (
            operation.type === "nagaana_endmill" ||
            operation.type === "nagaana_endmill_finish"
          ) {
            const isFinishing = operation.type === "nagaana_endmill_finish";
            console.log(
              `  🔧 Nagaana ${
                isFinishing ? "finish " : ""
              }endmill subroutine: ${operation.size} (${
                operation.operationNumber
              })`
            );
            // Nagaana endmill subroutine - calls ALL positions for merged nagaana
            const endmillDia = tool.diameter;

            // Adjust speed for finishing pass
            const endmillSpeed = isFinishing
              ? Math.round(speeds.millSpeed * 1.2)
              : speeds.millSpeed;

            subroutines += `O${operation.operationNumber}(${endmillDia}E${
              isFinishing ? "-FIN" : ""
            })\n`;
            subroutines += `M8\n`;
            subroutines += `S${endmillSpeed}M3\n`;

            // 🎯 CALL ALL POSITION SUBROUTINES FOR MERGED NAGAANA
            if (operation.processes && operation.processes.length > 0) {
              console.log(
                `    🔄 Calling ${operation.processes.length} merged positions:`
              );
              operation.processes.forEach((nagaanaProcess) => {
                const positionSubNumber = getPositionSubNumber(
                  {
                    processType: "nagaana",
                    size: nagaanaProcess.size,
                    type: "nagaana_endmill",
                  },
                  processes
                );
                console.log(
                  `      - M98P${positionSubNumber} (${nagaanaProcess.size})`
                );
                subroutines += `M98P${positionSubNumber}\n`;
              });
            }

            subroutines += `M99\n\n`;
          } else if (operation.type === "prehole") {
            // Prehole subroutine with dynamic Z-depth and calculated S/F
            const drillDia = tool.diameter;
            let zDepth;
            if (drillDia < 10) {
              zDepth = thickness + 3;
            } else if (drillDia >= 10 && drillDia < 18) {
              zDepth = thickness + 5;
            } else if (drillDia >= 15 && drillDia < 25) {
              zDepth = thickness + 7;
            } else {
              zDepth = thickness + 2;
            }

            // Calculate dynamic S and F based on material and drill diameter
            const material = document.querySelector(
              'input[name="material"]:checked'
            ).value;
            const drillSF = calculateDrillSpeedFeed(drillDia, material, speeds);

            subroutines += `O${operation.operationNumber}(${tool.diameter}-PREHOLE)\n`;
            subroutines += `M8\n`;
            subroutines += `G00G17G90S${drillSF.S}M3\n`;
            subroutines += `G83Z-${zDepth}.R1.Q1.5F${drillSF.F}L0\n`;
            subroutines += `M98P${getPositionSubNumber(
              operation,
              processes
            )}\n`;
            subroutines += `G00G80\n`;
            subroutines += `M99\n\n`;
          } else if (operation.type === "rough10") {
            // 10mm Rough subroutine - simplified without drill cycle
            subroutines += `O${operation.operationNumber}(10ROUGH-D21)\n`;
            subroutines += `M8\n`;
            subroutines += `S${speeds.millSpeed}M3\n`;
            subroutines += `M99\n\n`;
          } else if (operation.type === "finish10") {
            // 10mm Finish subroutine - simplified without drill cycle
            subroutines += `O${operation.operationNumber}(10E-D22)\n`;
            subroutines += `M8\n`;
            subroutines += `S${speeds.millSpeed}M3\n`;
            subroutines += `M99\n\n`;
          } else if (operation.type === "chamfer") {
            // Detect chamfer context
            const hasThreadedHoles = processes.some(
              (p) => p.type === "threaded"
            );
            const hasPrecisionHoles = processes.some(
              (p) => p.type === "precision"
            );
            const hasCounterboreHoles = processes.some(
              (p) => p.type === "counterbore"
            );
            const hasThroughHoles = processes.some((p) => p.type === "through");
            const hasMillingOps = processes.some((p) =>
              ["prehole", "rough10", "finish10"].includes(p.type)
            );

            if (
              (hasThreadedHoles ||
                hasPrecisionHoles ||
                hasCounterboreHoles ||
                hasThroughHoles) &&
              !hasMillingOps
            ) {
              // THREADED + CHAMFER: Like center drill with position calls
              console.log(
                `  🔧 Chamfer subroutine: THREADED context (${operation.operationNumber})`
              );
              subroutines += `O${operation.operationNumber}(MENTORI)\n`;
              subroutines += `M8\n`;
              subroutines += `G00G17G90S3000M3\n`;
              subroutines += `G82Z-1.3R1.P100F200L0\n`;

              // Add position calls for each threaded hole
              processes
                .filter((p) => p.type === "threaded")
                .forEach((process, index) => {
                  const drillData = {
                    M2: 0.9,
                    "M2.5": 1.1,
                    M3: 1.3,
                    M4: 1.8,
                    M5: 2.3,
                    M6: 2.8,
                    M8: 3.9,
                    M10: 3.0,
                    M12: 6,
                    M16: 4.0,
                    M20: 4.5,
                  };
                  subroutines += `Z-${drillData[process.size]}L0\n`;
                  subroutines += `M98P${1001 + index}(${process.size})\n`;
                });

              // Add position calls for each precision hole
              const threadedOffset = processes.filter(
                (p) => p.type === "threaded"
              ).length;
              processes
                .filter((p) => p.type === "precision")
                .forEach((process, index) => {
                  const precisionChamferData = {
                    "2H7": 1.0,
                    "3H7": 1.5,
                    "4H7": 2.0,
                    "5H7": 2.5,
                    "6H7": 3.0,
                    "8H7": 4.0,
                    "10H7": 5.0,
                    "12H7": 6.0,
                  };
                  const chamferDepth =
                    precisionChamferData[process.size] || 1.4; // Default fallback
                  subroutines += `Z-${chamferDepth}L0\n`;
                  subroutines += `M98P${1001 + threadedOffset + index}(${
                    process.size
                  })\n`;
                });
              // Add position calls for each counterbore hole
              const precisionOffset =
                processes.filter((p) => p.type === "threaded").length +
                processes.filter((p) => p.type === "precision").length;
              processes
                .filter((p) => p.type === "counterbore")
                .forEach((process, index) => {
                  const cbChamferData = {
                    "2.5/4.5E": 2.5,
                    "3.5/6.5E": 3.3,
                    "4.5/8E": 4.0,
                    "5.5/9.5E": 4.8,
                    "6.5/11E": 5.5,
                    "8.5/14E": 6.0,
                    "11/20E": 11.0,
                  };
                  const chamferDepth = cbChamferData[process.size] || 2.3; // Default fallback
                  subroutines += `Z-${chamferDepth}L0\n`;
                  subroutines += `M98P${1001 + precisionOffset + index}(${
                    process.size
                  })\n`;
                });
              // Add position calls for each through hole
              const throughOffset =
                processes.filter((p) => p.type === "threaded").length +
                processes.filter((p) => p.type === "precision").length +
                processes.filter((p) => p.type === "counterbore").length;
              processes
                .filter((p) => p.type === "through")
                .forEach((process, index) => {
                  const throughSize = parseFloat(process.size);
                  if (throughSize <= 11) {
                    // φ/2 chamfer depth for holes ≤φ11
                    const chamferDepth = (throughSize / 2).toFixed(1);
                    subroutines += `Z-${chamferDepth}L0\n`;
                    subroutines += `M98P${1001 + throughOffset + index}(${
                      process.size
                    })\n`;
                  } else {
                    // Just placeholder for holes >φ11 (no Z- depth)
                    subroutines += `M98P${1001 + throughOffset + index}(${
                      process.size
                    })\n`;
                  }
                });

              subroutines += `G00G80\n`;
              subroutines += `M99\n\n`;
            } else {
              // POCKET/CONTOUR + CHAMFER: Simple milling operation
              console.log(
                `  🔧 Chamfer subroutine: MILLING context (${operation.operationNumber})`
              );
              subroutines += `O${operation.operationNumber}(MENTORI)\n`;
              subroutines += `M8\n`;
              subroutines += `G00G17G90S4000M3\n`;
              subroutines += `M99\n\n`;
            }
          }
        });

        // Add position subroutines at the end
        subroutines += generatePositionSubroutines(processes);

        console.log(`✅ Subroutines complete. Total subroutines generated.`);
        return subroutines;
      }

      function getPositionSubNumber(operation, processes) {
        console.log(
          `🔍 POSITION SUB DEBUG: Getting position for ${operation.processType} ${operation.size}`
        );

        if (operation.processType === "threaded") {
          const index = processes
            .filter((p) => p.type === "threaded")
            .findIndex((p) => p.size === operation.size);
          const subNumber = 1001 + index;
          console.log(`  ➡️ THREADED: ${operation.size} → O${subNumber}`);
          return subNumber;
        } else if (operation.processType === "precision") {
          const offset = processes.filter((p) => p.type === "threaded").length;
          const index = processes
            .filter((p) => p.type === "precision")
            .findIndex((p) => p.size === operation.size);
          const subNumber = 1001 + offset + index;
          console.log(
            `  ➡️ PRECISION: ${operation.size} → O${subNumber} (offset=${offset})`
          );
          return subNumber;
        } else if (operation.processType === "counterbore") {
          const offset =
            processes.filter((p) => p.type === "threaded").length +
            processes.filter((p) => p.type === "precision").length;
          const index = processes
            .filter((p) => p.type === "counterbore")
            .findIndex((p) => p.size === operation.size);
          const subNumber = 1001 + offset + index;
          console.log(
            `  ➡️ COUNTERBORE: ${operation.size} → O${subNumber} (offset=${offset})`
          );
          return subNumber;
        } else if (operation.processType === "through") {
          const offset =
            processes.filter((p) => p.type === "threaded").length +
            processes.filter((p) => p.type === "precision").length +
            processes.filter((p) => p.type === "counterbore").length;
          const index = processes
            .filter((p) => p.type === "through")
            .findIndex((p) => p.size === operation.size);
          const subNumber = 1001 + offset + index;
          console.log(
            `  ➡️ THROUGH: ${operation.size} → O${subNumber} (offset=${offset})`
          );
          return subNumber;
        } else if (operation.processType === "nagaana") {
          console.log(
            `  🔧 NAGAANA POSITION DEBUG: operation.type = ${operation.type}, operation.size = ${operation.size}`
          );

          // ✅ NAGAANA ALWAYS USES ITS OWN POSITION SUBROUTINE
          // Even when sharing the drill operation, positions are separate!
          const offset =
            processes.filter((p) => p.type === "threaded").length +
            processes.filter((p) => p.type === "precision").length +
            processes.filter((p) => p.type === "counterbore").length +
            processes.filter((p) => p.type === "through").length;
          const index = processes
            .filter((p) => p.type === "nagaana")
            .findIndex((p) => p.size === operation.size);
          const subNumber = 1001 + offset + index;
          console.log(
            `  ➡️ NAGAANA POSITION: ${operation.size} → O${subNumber} (offset=${offset})`
          );
          return subNumber;
        } else if (operation.processType === "prehole") {
          const offset =
            processes.filter((p) => p.type === "threaded").length +
            processes.filter((p) => p.type === "precision").length +
            processes.filter((p) => p.type === "counterbore").length +
            processes.filter((p) => p.type === "through").length +
            processes.filter((p) => p.type === "nagaana").length;
          const index = processes
            .filter((p) => p.type === "prehole")
            .findIndex((p) => p.size === operation.size);
          const subNumber = 1001 + offset + index;
          console.log(
            `  ➡️ PREHOLE: ${operation.size} → O${subNumber} (offset=${offset})`
          );
          return subNumber;
        } else if (operation.processType === "rough10") {
          const offset =
            processes.filter((p) => p.type === "threaded").length +
            processes.filter((p) => p.type === "precision").length +
            processes.filter((p) => p.type === "counterbore").length +
            processes.filter((p) => p.type === "through").length +
            processes.filter((p) => p.type === "nagaana").length +
            processes.filter((p) => p.type === "prehole").length;
          const index = processes
            .filter((p) => p.type === "rough10")
            .findIndex((p) => p.size === operation.size);
          const subNumber = 1001 + offset + index;
          console.log(
            `  ➡️ ROUGH10: ${operation.size} → O${subNumber} (offset=${offset})`
          );
          return subNumber;
        } else if (operation.processType === "finish10") {
          const offset =
            processes.filter((p) => p.type === "threaded").length +
            processes.filter((p) => p.type === "precision").length +
            processes.filter((p) => p.type === "counterbore").length +
            processes.filter((p) => p.type === "through").length +
            processes.filter((p) => p.type === "nagaana").length +
            processes.filter((p) => p.type === "prehole").length +
            processes.filter((p) => p.type === "rough10").length;
          const index = processes
            .filter((p) => p.type === "finish10")
            .findIndex((p) => p.size === operation.size);
          const subNumber = 1001 + offset + index;
          console.log(
            `  ➡️ FINISH10: ${operation.size} → O${subNumber} (offset=${offset})`
          );
          return subNumber;
        } else if (operation.processType === "chamfer") {
          const offset =
            processes.filter((p) => p.type === "threaded").length +
            processes.filter((p) => p.type === "precision").length +
            processes.filter((p) => p.type === "counterbore").length +
            processes.filter((p) => p.type === "through").length +
            processes.filter((p) => p.type === "nagaana").length +
            processes.filter((p) => p.type === "prehole").length +
            processes.filter((p) => p.type === "rough10").length +
            processes.filter((p) => p.type === "finish10").length;
          const index = processes
            .filter((p) => p.type === "chamfer")
            .findIndex((p) => p.size === operation.size);
          const subNumber = 1001 + offset + index;
          console.log(
            `  ➡️ CHAMFER: ${operation.size} → O${subNumber} (offset=${offset})`
          );
          return subNumber;
        }
        console.log(`  ⚠️ FALLBACK: Unknown processType, returning 1001`);
        return 1001;
      }

      function generatePositionSubroutines(processes) {
        let positionSubs = "";
        let subNumber = 1001;

        // Generate position subroutines for each process type
        processes
          .filter((p) => p.type === "threaded")
          .forEach((process) => {
            positionSubs += `O${subNumber}(${process.size}-SB)\n`;
            positionSubs += `G90X0.Y0.\n`; // Placeholder positions
            positionSubs += `M99\n\n`;
            subNumber++;
          });

        processes
          .filter((p) => p.type === "precision")
          .forEach((process) => {
            positionSubs += `O${subNumber}(${process.size}-SB)\n`;
            positionSubs += `G90X0.Y0.\n`; // Placeholder positions
            positionSubs += `M99\n\n`;
            subNumber++;
          });

        processes
          .filter((p) => p.type === "counterbore")
          .forEach((process) => {
            positionSubs += `O${subNumber}(${process.size}-SB)\n`;
            positionSubs += `G90X0.Y0.\n`; // Placeholder positions
            positionSubs += `M99\n\n`;
            subNumber++;
          });

        processes
          .filter((p) => p.type === "through")
          .forEach((process) => {
            positionSubs += `O${subNumber}(${process.size}-SB)\n`;
            positionSubs += `G90X0.Y0.\n`; // Placeholder positions
            positionSubs += `M99\n\n`;
            subNumber++;
          });

        // Nagaana position subroutines - NEW FEATURE
        processes
          .filter((p) => p.type === "nagaana")
          .forEach((process) => {
            positionSubs += `O${subNumber}(${process.size}-SB)\n`;
            positionSubs += `G90X0.Y0.\n`; // Placeholder positions
            positionSubs += `M99\n\n`;
            subNumber++;
          });

        // Always generate PREHOLE position subroutine (needed for center drill)
        processes
          .filter((p) => p.type === "prehole")
          .forEach((process) => {
            positionSubs += `O${subNumber}(PREHOLE-SB)\n`;
            positionSubs += `G90X0.Y0.\n`; // Placeholder positions
            positionSubs += `M99\n\n`;
            subNumber++;
          });

        // Skip other milling position subroutines for milling-only operations
        const millingProcesses = processes.filter((p) =>
          ["prehole", "rough10", "finish10", "chamfer"].includes(p.type)
        );
        const isMillingOnly =
          millingProcesses.length > 0 &&
          processes.filter((p) =>
            ["threaded", "precision", "counterbore", "through"].includes(p.type)
          ).length === 0;

        if (!isMillingOnly) {
          processes
            .filter((p) => p.type === "rough10")
            .forEach((process) => {
              positionSubs += `O${subNumber}(ROUGH10-SB)\n`;
              positionSubs += `G90X0.Y0.\n`; // Placeholder positions
              positionSubs += `M99\n\n`;
              subNumber++;
            });

          processes
            .filter((p) => p.type === "finish10")
            .forEach((process) => {
              positionSubs += `O${subNumber}(FINISH10-SB)\n`;
              positionSubs += `G90X0.Y0.\n`; // Placeholder positions
              positionSubs += `M99\n\n`;
              subNumber++;
            });

          // Only generate chamfer position subroutines for milling context
          const hasThreadedHoles = processes.some((p) => p.type === "threaded");
          const hasMillingOps = processes.some((p) =>
            ["prehole", "rough10", "finish10"].includes(p.type)
          );

          if (!hasThreadedHoles || hasMillingOps) {
            processes
              .filter((p) => p.type === "chamfer")
              .forEach((process) => {
                positionSubs += `O${subNumber}(CHAMFER-SB)\n`;
                positionSubs += `G90X0.Y0.\n`; // Placeholder positions
                positionSubs += `M99\n\n`;
                subNumber++;
              });
          }
        }

        return positionSubs;
      }

      function copyToClipboard() {
        console.log("📋 Copying program to clipboard...");
        const output = document.getElementById("program-output").textContent;
        navigator.clipboard
          .writeText(output)
          .then(() => {
            console.log("✅ Program copied to clipboard successfully!");
            alert("Program copied to clipboard!");
          })
          .catch((err) => {
            console.error("❌ Failed to copy to clipboard:", err);
            alert("Failed to copy to clipboard. Please copy manually.");
          });
      }
    </script>
  </body>
